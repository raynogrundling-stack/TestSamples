<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Sample Label
    </title>

    <style>

        @page {
            margin: 0;
            size: auto;
        }

        body {

            margin: 0;

            padding: 10mm;

            font-family: Arial, Helvetica, sans-serif;

            background: #ffffff;

            color: #000000;

        }

        .label {

            width: 100mm;

            min-height: 50mm;

            border: 2px solid #000;

            padding: 10px;

            margin: 0 auto;

            text-align: center;

            box-sizing: border-box;

        }

        .sample-number {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 10px;

        }

        .customer {

            font-size: 16px;

            margin-bottom: 10px;

        }

        .reference {

            font-size: 14px;

            margin-bottom: 10px;

        }

        .barcode {

            margin-top: 10px;

        }

        .barcode img {

            max-width: 100%;

            height: auto;

        }

        .footer {

            margin-top: 10px;

            font-size: 12px;

        }

        @media print {

            body {

                padding: 0;

            }

            .label {

                border: 2px solid #000;

                page-break-inside: avoid;

                break-inside: avoid;

            }

        }

    </style>

</head>

<body onload="window.print()">

    <div class="label">

        <div class="sample-number">

            {{ submission.sample_number }}

        </div>

        <div class="customer">

            {{ submission.customer_name }}

        </div>

        <div class="reference">

            Ref: {{ submission.order_reference }}

        </div>

        <div class="barcode">

            {{ url_for('submissions.barcode', id=submission.id) }}

        </div>

        <div class="footer">

            Laboratory Sample Label

        </div>

    </div>

</body>

</html>
