{% block title %}

{% block admin_content %}
<div class="container-fluid">
    <h3 class="mb-4">
        Create Customer
    </h3>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        Customer Name
                    </label>
                    <input
                        type="text"
                        name="customer_name"
                        class="form-control"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Customer Code
                    </label>
                    <input
                        type="text"
                        name="customer_code"
                        class="form-control"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Contact Number
                    </label>
                    <input
                        type="text"
                        name="contact_number"
                        class="form-control">
                </div>
                <button
                    type="submit"
                    class="btn btn-success">
                    Save
                </button>
