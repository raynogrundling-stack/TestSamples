{% extends "admin/base.html" %}

{% block title %}
Email Dashboard
{% endblock %}

{% block admin_content %}

<div class="container-fluid">

    <h3 class="mb-4">
        Email Monitoring Dashboard
    </h3>

    <div class="row">

        <div class="col-md-2">

            <div class="card text-center bg-primary text-white">

                <div class="card-body">

                    <h6>Pending</h6>

                    <h2>
                        {{ stats.pending }}
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-2">

            <div class="card text-center bg-warning">

                <div class="card-body">

                    <h6>Sending</h6>

                    <h2>
                        {{ stats.sending }}
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-2">

            <div class="card text-center bg-success text-white">

                <div class="card-body">

                    <h6>Sent</h6>

                    <h2>
                        {{ stats.sent }}
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-2">

            <div class="card text-center bg-info text-white">

                <div class="card-body">

                    <h6>Retrying</h6>

                    <h2>
                        {{ stats.retrying }}
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-2">

            <div class="card text-center bg-danger text-white">

                <div class="card-body">

                    <h6>Failed</h6>

                    <h2>
                        {{ stats.failed }}
                    </h2>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
