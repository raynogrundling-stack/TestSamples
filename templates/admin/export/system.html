{% extends "admin/base.html" %}
{% block title %}
Audit Export
{% endblock %}
{% block admin_content %}
<div class="container-fluid">
    <h3>
        Audit Log Export
    </h3>
    <div class="card">
        <div class="card-body">
            <p>
                Export audit records.
            </p>
             <a href="{{ url_for('exports.system_download') }}"
              class="btn btn-primary">
                Download Audit Export
            </a>
            <a href="{{ url_for('exports.index') }}"
              class="btn btn-primary">
               Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
