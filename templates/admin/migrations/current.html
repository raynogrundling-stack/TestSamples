{% extends "admin/base.html" %}
{% block title %}
Current Migration
{% endblock %}
{% block admin_content %}
<div class="container-fluid">
    <h3 class="mb-4">
        Current Migration Status
    </h3>
    <div class="card">
        <div class="card-header">
            Database Status
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <tr>
                    <th width="30%">
                        Migration Engine
                    </th>
                    <td>
                        Flask-Migrate / Alembic
                    </td>
                </tr>
                <tr>
                    <th>
                        Status
                    </th>
                    <td>
                        Available
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div class="mt-3">
        <a href="{{ url_for('migrations.index') }}"
         class="btn btn-secondary">
         Back
        </a>
    </div>
</div>
{% endblock %}
