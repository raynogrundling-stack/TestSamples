{% extends "admin/base.html" %}

{% block title %}
Create Category
{% endblock %}
{% block admin_content %}
<div class="container-fluid">
    <h3 class="mb-4">
        Create Dropdown Category
    </h3>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label
                        class="form-label">
                        Name
                    </label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required>
                </div>
                <div class="mb-3">
                    <label
                        class="form-label">
                        Description
                    </label>
                    <textarea
                        name="description"
                        class="form-control"
                        rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label
                        class="form-label">
                        Field Type
                    </label>
                    <select
                        name="input_type"
                        class="form-select">
                        <option
                            value="dropdown"
                            selected>
                            Single Select Dropdown
                        </option>
                        <option
                            value="checklist">
                            Multi Select Checklist
                        </option>
                    </select>
                    <div class="form-text">
                        Select whether users choose one value
                        from a dropdown or multiple values
                        from a checklist.
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input
                        type="checkbox"
                        name="active"
                        class="form-check-input"
                        checked>
                    <label
                        class="form-check-label">
                        Active
                    </label>
                </div>
                <button type="submit"
                        class="btn btn-success">
                    Save
                </button>
                 <a href="{{ url_for('dropdowns.index') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
