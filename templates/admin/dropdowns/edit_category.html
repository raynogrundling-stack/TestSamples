{% extends "admin/base.html" %}
{% block title %}
Edit Category
{% endblock %}
{% block admin_content %}
<div class="container-fluid">
    <h3 class="mb-4">
        Edit Category
    </h3>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ category.name }}"
                           required>
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>
                    <textarea name="description"
                              class="form-control">{{ category.description }}</textarea>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox"
                           name="active"
                           class="form-check-input"
                           {% if category.active %}checked{% endif %}>
                    <label class="form-check-label">
                        Active
                    </label>
                </div>
                <button type="submit"
                        class="btn btn-primary">
                    Update
                </button>
                <a href="{{ url_for('dropdowns.index') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
