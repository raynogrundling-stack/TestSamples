{% extends "admin/base.html" %}
{% block title %}
Import Backup ZIP
{% endblock %}
{% block admin_content %}
<div class="container-fluid">
    <h3 class="mb-4">
        Restore From Backup
    </h3>
    <div class="card border-warning">
        <div class="card-header bg-warning">
            Warning
        </div>
        <div class="card-body">
            Importing may overwrite
            existing application data.
        </div>
    </div>
    <div class="card mt-4">
        <div class="card-body">
            <form method="POST"
                  enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">
                        Backup ZIP File
                    </label>
                    <input
                        type="file"
                        name="file"
                        accept=".zip"
                        class="form-control"
                        required>
                </div>
                <button
                    type="submit"
                    class="btn btn-danger">
                    Import Backup
                </button>
                <a href="{{ url_for('imports.index') }}"
                  class="btn btn-primary">
                   Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
