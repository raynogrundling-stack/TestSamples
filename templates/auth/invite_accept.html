{% extends "base.html" %}

{% block title %}
Accept Invitation
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card">

            <div class="card-header">

                <h4>Accept Invitation</h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ user.name }}"
                            readonly>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Activate Account

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
