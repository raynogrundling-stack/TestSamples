{% extends "base.html" %}

{% block title %}
Verify Email
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="alert alert-info">

            <h4>Email Verification</h4>

            <p>

                Click the button below to
                verify your email address.

            </p>

            <form method="POST">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Verify Email

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
